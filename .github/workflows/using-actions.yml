name: Using Actions

on: push

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: react-app
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Use Node.js 20.x
              uses: actions/setup-node@v3
              with:
                node-version: '20.x'

            - name: Install dependencies
              run: npm ci
              